<body>
  <div id="app-root">
    <!-- Верхняя панель -->
    <div id="top-panel">
      <div class="stat-item">
        <span>Shapes count:</span>
        <span id="shapes-count">0</span>
      </div>
      <div class="stat-item">
        <span>Total area (px²):</span>
        <span id="shapes-area">0</span>
      </div>
    </div>

    <!-- Контейнер для Pixi-канваса -->
    <div id="app"></div>

    <!-- Нижняя панель -->
    <div id="bottom-panel">
      <div class="control-group">
        <span>Shapes per second:</span>
        <button id="btn-shapes-dec">-</button>
        <input
          id="shapes-per-second-input"
          type="number"
          value="2"
          min="0"
          step="1"
        />
        <button id="btn-shapes-inc">+</button>
      </div>
    
      <div class="control-group">
        <span>Gravity:</span>
        <button id="btn-gravity-dec">-</button>
        <input
          id="gravity-input"
          type="number"
          value="50"
          min="0"
          step="10"
        />
        <button id="btn-gravity-inc">+</button>
      </div>
    </div>    
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
